name: Yayınla — Destek ve Gizlilik Sayfaları

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sayfaları hazırla
        uses: actions/checkout@v4
      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5
      - name: Sayfaları yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
